plugins { id 'com.android.application' }

// Nomor versi naik otomatis tiap build di GitHub; tag v1.2 menjadi nama versi 'v1.2'
def vCode = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '3')
def vName = (System.getenv('GITHUB_REF_TYPE') == 'tag') ? System.getenv('GITHUB_REF_NAME') : '1.2-dev'
// Kunci tetap dari GitHub Secrets (diisi oleh build.yml). Kalau tidak ada, jatuh ke kunci debug.
def ksFile = System.getenv('KEYSTORE_FILE')
def useRelease = ksFile && new File(ksFile).exists()

android {
    namespace 'com.bukutoko.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.bukutoko.app'
        minSdk 29
        targetSdk 34
        versionCode vCode
        versionName vName
    }
    signingConfigs {
        release {
            if (useRelease) {
                storeFile new File(ksFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig useRelease ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
