name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BukuToko-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Buat GitHub Release (hanya saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "BukuToko-${{ github.ref_name }}.apk"
          gh release create "${{ github.ref_name }}" "BukuToko-${{ github.ref_name }}.apk" \
            --title "Buku Toko ${{ github.ref_name }}" --generate-notes
